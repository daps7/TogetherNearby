    <main class="simple-page narrow-page"><h1>Settings</h1><p class="subtitle">Choose how Together Nearby behaves.</p><div class="settings-list"><label class="setting-row"><span><strong>Large text</strong><small>Make words easier to read.</small></span><input id="largeTextSetting" type="checkbox"></label><label class="setting-row"><span><strong>Dark mode</strong><small>Use a darker colour scheme.</small></span><input id="darkModeSetting" type="checkbox"></label><label class="setting-row"><span><strong>Premium account</strong><small>Unlock up to 20 created events and extra account features.</small></span><input id="premiumSetting" type="checkbox"></label></div><details class="advanced-settings"><summary>Advanced settings</summary><label class="setting-row"><span><strong>Text-to-speech</strong><small>Read event details aloud when browsing.</small></span><select id="speechSetting"><option value="off">Off</option><option value="on">On</option></select></label></details></main>
